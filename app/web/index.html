<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumaqix</title><link rel="stylesheet" href="/web/style.css"></head>
<body><main>
<section class="card hero"><h1>LUmaqix</h1><p>Telegram Mini App</p><div id="balance">Loading...</div></section>
<section class="card"><h2>🎁 Daily Gift</h2><button id="gift">Claim +10 Coins</button></section>
<section class="card"><h2>🎁 Invite Gift Box</h2><button id="box">Open Gift Box</button></section>
<section class="card"><h2>💸 Withdraw — USDT BEP20</h2>
<input id="amount" type="number" step="0.0001" placeholder="Amount (min 0.1)">
<input id="address" placeholder="BEP20 wallet address">
<button id="withdraw">Withdraw</button><p id="msg"></p></section>
</main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg=window.Telegram.WebApp; tg.ready(); tg.expand();
const initData=encodeURIComponent(tg.initData);
async function api(path,opt={}){return fetch(path+(path.includes('?')?'&':'?')+'initData='+initData,opt).then(r=>r.json())}
async function load(){const x=await api('/api/me'); document.querySelector('#balance').textContent=(x.usdt||0)+' USDT · '+(x.coins||0)+' coins'}
document.querySelector('#gift').onclick=async()=>{alert((await api('/api/daily-gift',{method:'POST'})).message||'Gift claimed');load()}
document.querySelector('#box').onclick=async()=>{alert((await api('/api/open-invite-gift',{method:'POST'})).message||'Gift opened');load()}
document.querySelector('#withdraw').onclick=async()=>{let a=document.querySelector('#amount').value,w=encodeURIComponent(document.querySelector('#address').value);let x=await fetch('/api/withdraw?initData='+initData+'&amount='+a+'&address='+w,{method:'POST'}).then(r=>r.json());document.querySelector('#msg').textContent=x.message||x.status||'Done';load()}
load();
</script></body></html>

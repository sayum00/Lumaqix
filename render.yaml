services:
  - type: web
    name: lumaqix-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lumaqix-db
          property: connectionString
      - key: BSC_RPC_URL
        sync: false
      - key: BSC_CHAIN_ID
        value: "97"
      - key: USDT_CONTRACT
        sync: false
      - key: TREASURY_ADDRESS
        sync: false
      - key: HOT_WALLET_PRIVATE_KEY
        sync: false

databases:
  - name: lumaqix-db
    databaseName: lumaqix
    user: lumaqix

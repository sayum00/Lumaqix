<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumaqix</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:system-ui;background:#0b1020;color:#fff;margin:0;padding:18px}.card{background:#151d35;border:1px solid #293556;border-radius:16px;padding:16px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{width:100%;padding:13px;border:0;border-radius:12px;background:#2f6fed;color:#fff;font-weight:700}input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #394565;background:#0e1427;color:#fff;margin:6px 0}.muted{color:#9ba8c7}.hidden{display:none}.tx{padding:8px 0;border-bottom:1px solid #28324d}h2{margin:4px 0}</style></head><body><div class="card"><div class="muted">Lumaqix</div><h2 id="name">Loading…</h2><div>Balance: <b id="balance">0.00 USD</b></div></div><div class="grid"><button onclick="show('deposit')">➕ Deposit</button><button onclick="show('withdraw')">💸 Withdraw</button><button onclick="referral()">👥 Referral</button><button onclick="transactions()">💳 Transactions</button><button onclick="daily()">🎁 Daily Reward</button><button onclick="stats()">📊 Statistics</button></div><div id="panel" class="card hidden"></div><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();let init=tg?.initData||'';const H={'Content-Type':'application/json','X-Telegram-Init-Data':init};
async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{...H,...(opt.headers||{})}});return r.json()}
async function load(){let x=await api('/api/me');if(!x.ok){document.getElementById('name').textContent='Open this Mini App from Telegram';return}document.getElementById('name').textContent=x.user.first_name||x.user.username||'User';document.getElementById('balance').textContent=Number(x.user.balance).toFixed(2)+' USD'}
function show(type){let p=document.getElementById('panel');p.classList.remove('hidden');if(type==='deposit')p.innerHTML='<h3>Deposit USDT (BEP-20)</h3><input id="amt" type="number" min="0" step="0.01" placeholder="USD amount"><button onclick="deposit()">Create Payment</button><div id="result"></div>';else p.innerHTML='<h3>Withdraw USDT (BEP-20)</h3><input id="wamt" type="number" min="0" step="0.01" placeholder="USD amount"><input id="addr" placeholder="BEP-20 wallet address"><button onclick="withdraw()">Submit Withdrawal</button><div id="result"></div>'}
async function deposit(){let amount=document.getElementById('amt').value;let x=await api('/api/deposit',{method:'POST',body:JSON.stringify({amount})});document.getElementById('result').innerHTML=x.ok?`<p>Send <b>${x.payment.pay_amount} ${x.payment.pay_currency}</b></p><p>${x.payment.pay_address}</p>`:`<p>${x.error}</p>`}
async function withdraw(){let amount=document.getElementById('wamt').value,address=document.getElementById('addr').value;let x=await api('/api/withdraw',{method:'POST',body:JSON.stringify({amount,address})});document.getElementById('result').textContent=x.ok?`Request: ${x.withdrawal_id} — ${x.status}`:x.error;load()}
async function referral(){let x=await api('/api/referral');let p=document.getElementById('panel');p.classList.remove('hidden');p.innerHTML=`<h3>Referral</h3><p>${x.referral_link}</p><p>Invited: ${x.count}</p><p>Earnings: ${Number(x.earnings).toFixed(2)} USD</p><p>Commission: ${x.commission_percent}%</p>`}
async function transactions(){let x=await api('/api/transactions');let p=document.getElementById('panel');p.classList.remove('hidden');p.innerHTML='<h3>Transactions</h3>'+x.transactions.map(t=>`<div class="tx">${t.type} — ${t.amount} ${t.currency} — ${t.status}</div>`).join('')}
async function daily(){let x=await api('/api/daily',{method:'POST'});alert(x.message||`Reward: ${x.reward||0}`);load()}
async function stats(){let x=await api('/api/referral');let p=document.getElementById('panel');p.classList.remove('hidden');p.innerHTML=`<h3>My Statistics</h3><p>Balance: ${Number(document.getElementById('balance').textContent).toFixed(2)} USD</p><p>Referrals: ${x.count}</p><p>Referral earnings: ${Number(x.earnings).toFixed(2)} USD</p>`}
load();</script></body></html>

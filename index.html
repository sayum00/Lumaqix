<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumaqix</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui;background:#07111f;color:#fff}.wrap{max-width:560px;margin:auto}.top,.panel{background:#0d1a2b;border:1px solid #29405e;border-radius:20px;padding:16px;margin:10px 0}.top{background:linear-gradient(135deg,#172d4e,#0d1b31)}.logo,.small{color:#9db0c8;font-size:12px}.name{font-size:24px;font-weight:800}.bal{font-size:32px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;padding:14px;border:0;border-radius:14px;background:#173556;color:#fff;font-weight:800}.primary{background:#246bce}.reward{background:#10352d}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #20344b}input,textarea{width:100%;padding:12px;margin:6px 0;background:#081321;color:#fff;border:1px solid #314b6d;border-radius:11px}.copy{word-break:break-all;background:#081321;padding:10px;border-radius:10px}.ok{color:#71e0a4}.warn{color:#ffd66e}</style></head><body><div class="wrap"><div class="top"><div class="logo">LUMAQIX</div><div class="name" id="name">Loading…</div><div class="small">Available Balance</div><div class="bal">$<span id="balance">0.00</span></div></div><div class="panel reward"><b>🎁 Daily Reward</b><p class="small">One random reward every 24 hours.</p><button class="btn primary" onclick="daily()">Claim Daily Reward</button><div id="dailyMsg"></div></div><div class="grid"><button class="btn primary" onclick="depositPanel()">➕ Deposit</button><button class="btn" onclick="withdrawPanel()">💸 Withdraw</button><button class="btn" onclick="referral()">👥 Referral</button><button class="btn" onclick="stats()">📊 Statistics</button><button class="btn" onclick="txs()">💳 Transactions</button><button class="btn" onclick="adminPanel()">🛠 Admin</button></div><div id="panel" class="panel"></div></div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const init=tg?.initData||'';const H={'Content-Type':'application/json','X-Telegram-Init-Data':init};async function api(p,o={}){let r=await fetch(p,{...o,headers:{...H,...(o.headers||{})}});return r.json()}function m(n){return Number(n||0).toFixed(2)}function load(){api('/api/me').then(x=>{if(x.ok){name.textContent=x.user.first_name||x.user.username||'User';balance.textContent=m(x.user.balance)}else name.textContent='Open from Telegram'})}function box(s){panel.innerHTML=s}function depositPanel(){box('<h3>➕ Deposit USDT (BEP-20)</h3><div class="small">Minimum $10</div><input id="amt" type="number" step="0.01" placeholder="USD amount"><button class="btn primary" onclick="deposit()">Create Payment</button><div id="res"></div>')}async function deposit(){let x=await api('/api/deposit',{method:'POST',body:JSON.stringify({amount:amt.value})});res.innerHTML=x.ok?'<p class="ok">Send exactly '+x.payment.pay_amount+' '+x.payment.pay_currency+'</p><div class="copy">'+x.payment.pay_address+'</div><p class="small">Payment ID: '+x.payment.payment_id+'</p>':'<p class="warn">'+x.error+'</p>'}function withdrawPanel(){box('<h3>💸 Withdraw USDT (BEP-20)</h3><div class="small">Minimum $10</div><input id="wa" type="number" step="0.01" placeholder="USD amount"><input id="ad" placeholder="0x... BSC address"><button class="btn primary" onclick="withdraw()">Submit Withdrawal</button><div id="res"></div>')}async function withdraw(){let x=await api('/api/withdraw',{method:'POST',body:JSON.stringify({amount:wa.value,address:ad.value})});res.innerHTML=x.ok?'<p class="ok">Withdrawal '+x.status+'</p>':'<p class="warn">'+x.error+'</p>';load()}async function daily(){let x=await api('/api/daily',{method:'POST',body:'{}'});dailyMsg.innerHTML=x.ok?'<p class="ok">Received $'+m(x.reward)+' 🎉</p>':'<p class="small">'+(x.remaining?'Already claimed for today.':(x.error||'Unavailable'))+'</p>';load()}async function referral(){let x=await api('/api/referral');box('<h3>👥 Referral</h3><p>Invited: <b>'+x.count+'</b></p><p>Earnings: <b>$'+m(x.earnings)+'</b></p><p>Commission: <b>'+x.commission_percent+'%</b></p><div class="copy">'+x.referral_link+'</div>')}async function stats(){let x=await api('/api/stats');box('<h3>📊 Statistics</h3><div class="row">Deposits <b>$'+m(x.stats.deposits)+'</b></div><div class="row">Referrals <b>'+x.stats.referrals+'</b></div><div class="row">Rewards <b>$'+m(x.stats.rewards)+'</b></div><div class="row">Withdrawn <b>$'+m(x.stats.withdrawn)+'</b></div>')}async function txs(){let x=await api('/api/transactions');box('<h3>💳 Transactions</h3>'+x.transactions.map(t=>'<div class="row"><span>'+t.type+'<br><small>'+t.status+'</small></span><b>'+m(t.amount)+'</b></div>').join(''))}async function adminPanel(){let x=await api('/api/admin/overview');if(!x.ok){box('<p>Admin only.</p>');return}box('<h3>🛠 Admin</h3><div class="row">Users <b>'+x.overview.users+'</b></div><div class="row">Blocked <b>'+x.overview.blocked+'</b></div><div class="row">Total balance <b>$'+m(x.overview.balance_total)+'</b></div><div class="row">Completed deposits <b>'+x.overview.deposits+'</b></div><div class="row">Pending withdrawals <b>'+x.overview.withdrawals_pending+'</b></div><textarea id="bm" placeholder="Broadcast message"></textarea><button class="btn primary" onclick="broadcast()">Send Broadcast</button><div id="am"></div>')}async function broadcast(){let x=await api('/api/admin/broadcast',{method:'POST',body:JSON.stringify({message:bm.value})});am.textContent=x.ok?'Sent '+x.sent+' • Failed '+x.failed:x.error}load();</script></body></html>

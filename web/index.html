<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumaqix</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:14px;
  font-family:system-ui,-apple-system,sans-serif;
  background:#07111f;
  color:#fff
}

.wrap{
  max-width:560px;
  margin:auto
}

.top,.panel{
  background:#0d1a2b;
  border:1px solid #29405e;
  border-radius:20px;
  padding:16px;
  margin:10px 0
}

.top{
  background:linear-gradient(135deg,#172d4e,#0d1b31)
}

.logo,.small{
  color:#9db0c8;
  font-size:12px
}

.name{
  font-size:24px;
  font-weight:800;
  margin:5px 0
}

.bal{
  font-size:32px;
  font-weight:900
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:14px;
  background:#173556;
  color:#fff;
  font-weight:800;
  font-size:14px
}

.primary{
  background:#246bce
}

.reward{
  background:#10352d
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #20344b
}

input,textarea{
  width:100%;
  padding:12px;
  margin:6px 0;
  background:#081321;
  color:#fff;
  border:1px solid #314b6d;
  border-radius:11px
}

textarea{
  min-height:100px;
  resize:vertical
}

.copy{
  word-break:break-all;
  background:#081321;
  padding:10px;
  border-radius:10px;
  margin:8px 0
}

.ok{
  color:#71e0a4
}

.warn{
  color:#ffd66e
}

.hidden{
  display:none
}

hr{
  border:0;
  border-top:1px solid #20344b;
  margin:16px 0
}

h3{
  margin-top:0
}
</style>
</head>

<body>

<div class="wrap">

  <!-- HEADER -->
  <div class="top">
    <div class="logo">LUMAQIX</div>

    <div class="name" id="name">
      Loading…
    </div>

    <div class="small">
      Available Balance
    </div>

    <div class="bal">
      $<span id="balance">0.00</span>
    </div>
  </div>


  <!-- DAILY REWARD -->
  <div class="panel reward">

    <b>🎁 Daily Reward</b>

    <p class="small">
      One random reward every 24 hours.
    </p>

    <button
      class="btn primary"
      onclick="daily()">
      Claim Daily Reward
    </button>

    <div id="dailyMsg"></div>

  </div>


  <!-- MAIN BUTTONS -->
  <div class="grid">

    <button
      class="btn primary"
      onclick="depositPanel()">
      ➕ Deposit
    </button>

    <button
      class="btn"
      onclick="withdrawPanel()">
      💸 Withdraw
    </button>

    <button
      class="btn"
      onclick="referral()">
      👥 Referral
    </button>

    <button
      class="btn"
      onclick="stats()">
      📊 Statistics
    </button>

    <button
      class="btn"
      onclick="txs()">
      💳 Transactions
    </button>

    <button
      class="btn"
      onclick="adminPanel()">
      🛠 Admin
    </button>

  </div>


  <!-- DYNAMIC PANEL -->
  <div
    id="panel"
    class="panel hidden">
  </div>

</div>


<script>

/* =========================
   TELEGRAM
========================= */

const tg = window.Telegram?.WebApp;

tg?.ready();
tg?.expand();

const init = tg?.initData || "";

const H = {
  "Content-Type":"application/json",
  "X-Telegram-Init-Data":init
};


/* =========================
   API
========================= */

async function api(path, options={}){

  try{

    const response = await fetch(
      path,
      {
        ...options,
        headers:{
          ...H,
          ...(options.headers || {})
        }
      }
    );

    return await response.json();

  }catch(e){

    return {
      ok:false,
      error:"Network error. Please try again."
    };

  }

}


/* =========================
   HELPERS
========================= */

function money(value){

  return Number(value || 0).toFixed(2);

}


function showPanel(html){

  const p = document.getElementById("panel");

  p.classList.remove("hidden");

  p.innerHTML = html;

  window.scrollTo({
    top:p.offsetTop,
    behavior:"smooth"
  });

}


/* =========================
   LOAD USER
========================= */

async function load(){

  const x = await api("/api/me");

  if(!x.ok){

    document.getElementById("name").textContent =
      "Open from Telegram";

    return;
  }

  document.getElementById("name").textContent =
    x.user.first_name ||
    x.user.username ||
    "User";

  document.getElementById("balance").textContent =
    money(x.user.balance);

}


/* =========================
   DAILY REWARD
========================= */

async function daily(){

  const msg =
    document.getElementById("dailyMsg");

  msg.innerHTML =
    '<p class="small">Checking reward...</p>';

  const x = await api(
    "/api/daily",
    {
      method:"POST",
      body:"{}"
    }
  );

  if(x.ok){

    msg.innerHTML =
      '<p class="ok">Received $' +
      money(x.reward) +
      ' 🎉</p>';

    load();

  }else{

    if(x.remaining){

      msg.innerHTML =
        '<p class="small">Already claimed. Try again later.</p>';

    }else{

      msg.innerHTML =
        '<p class="warn">' +
        (x.error || x.message || "Unavailable") +
        '</p>';

    }

  }

}


/* =========================
   DEPOSIT
========================= */

function depositPanel(){

  showPanel(`

    <h3>➕ Deposit USDT (BEP-20)</h3>

    <div class="small">
      Minimum deposit: $10
    </div>

    <input
      id="amt"
      type="number"
      min="10"
      step="0.01"
      placeholder="USD amount">

    <button
      class="btn primary"
      onclick="deposit()">
      Create Payment
    </button>

    <div id="depositResult"></div>

  `);

}


async function deposit(){

  const amount =
    document.getElementById("amt").value;

  if(!amount || Number(amount) < 10){

    document.getElementById("depositResult").innerHTML =
      '<p class="warn">Minimum deposit is $10.</p>';

    return;
  }

  document.getElementById("depositResult").innerHTML =
    '<p class="small">Creating payment...</p>';

  const x = await api(
    "/api/deposit",
    {
      method:"POST",
      body:JSON.stringify({
        amount:amount
      })
    }
  );

  const result =
    document.getElementById("depositResult");

  if(!x.ok){

    result.innerHTML =
      '<p class="warn">' +
      (x.error || "Unable to create payment.") +
      '</p>';

    return;
  }

  const p = x.payment;

  result.innerHTML = `

    <p class="ok">
      Payment created.
    </p>

    <p>
      Send exactly
      <b>${p.pay_amount} ${p.pay_currency}</b>
    </p>

    <div class="copy">
      ${p.pay_address}
    </div>

    <p class="small">
      Payment ID: ${p.payment_id}
    </p>

  `;

}


/* =========================
   WITHDRAW
========================= */

function withdrawPanel(){

  showPanel(`

    <h3>💸 Withdraw USDT (BEP-20)</h3>

    <div class="small">
      Minimum withdrawal: $10
    </div>

    <input
      id="wa"
      type="number"
      min="10"
      step="0.01"
      placeholder="USD amount">

    <input
      id="ad"
      type="text"
      placeholder="0x... BSC wallet address">

    <button
      class="btn primary"
      onclick="withdraw()">
      Submit Withdrawal
    </button>

    <div id="withdrawResult"></div>

  `);

}


async function withdraw(){

  const amount =
    document.getElementById("wa").value;

  const address =
    document.getElementById("ad").value.trim();

  const result =
    document.getElementById("withdrawResult");

  if(!amount || Number(amount) < 10){

    result.innerHTML =
      '<p class="warn">Minimum withdrawal is $10.</p>';

    return;
  }

  if(!address){

    result.innerHTML =
      '<p class="warn">Please enter your BSC wallet address.</p>';

    return;
  }

  result.innerHTML =
    '<p class="small">Submitting withdrawal...</p>';

  const x = await api(
    "/api/withdraw",
    {
      method:"POST",
      body:JSON.stringify({
        amount:amount,
        address:address
      })
    }
  );

  if(x.ok){

    result.innerHTML =
      '<p class="ok">Withdrawal ' +
      (x.status || "submitted") +
      '.</p>';

    load();

  }else{

    result.innerHTML =
      '<p class="warn">' +
      (x.error || "Withdrawal failed.") +
      '</p>';

  }

}


/* =========================
   REFERRAL
========================= */

async function referral(){

  const x =
    await api("/api/referral");

  if(!x.ok){

    showPanel(
      '<p class="warn">' +
      (x.error || "Unable to load referral.") +
      '</p>'
    );

    return;
  }

  showPanel(`

    <h3>👥 Referral</h3>

    <div class="row">
      <span>Invited</span>
      <b>${x.count || 0}</b>
    </div>

    <div class="row">
      <span>Referral Earnings</span>
      <b>$${money(x.earnings)}</b>
    </div>

    <div class="row">
      <span>Commission</span>
      <b>${x.commission_percent || 0}%</b>
    </div>

    <p class="small">
      Your referral link
    </p>

    <div class="copy">
      ${x.referral_link || ""}
    </div>

    <button
      class="btn primary"
      onclick="copyReferral()">
      📋 Copy Referral Link
    </button>

  `);

  window.currentReferral =
    x.referral_link || "";

}


async function copyReferral(){

  if(!window.currentReferral)
    return;

  try{

    await navigator.clipboard.writeText(
      window.currentReferral
    );

    alert("Referral link copied!");

  }catch(e){

    alert(window.currentReferral);

  }

}


/* =========================
   STATISTICS
========================= */

async function stats(){

  const x =
    await api("/api/stats");

  if(!x.ok){

    showPanel(
      '<p class="warn">' +
      (x.error || "Unable to load statistics.") +
      '</p>'
    );

    return;
  }

  const s =
    x.stats || {};

  showPanel(`

    <h3>📊 Statistics</h3>

    <div class="row">
      <span>Deposits</span>
      <b>$${money(s.deposits)}</b>
    </div>

    <div class="row">
      <span>Referrals</span>
      <b>${s.referrals || 0}</b>
    </div>

    <div class="row">
      <span>Rewards</span>
      <b>$${money(s.rewards)}</b>
    </div>

    <div class="row">
      <span>Withdrawn</span>
      <b>$${money(s.withdrawn)}</b>
    </div>

  `);

}


/* =========================
   TRANSACTIONS
========================= */

async function txs(){

  const x =
    await api("/api/transactions");

  if(!x.ok){

    showPanel(
      '<p class="warn">' +
      (x.error || "Unable to load transactions.") +
      '</p>'
    );

    return;
  }

  const list =
    x.transactions || [];

  if(!list.length){

    showPanel(`

      <h3>💳 Transactions</h3>

      <p class="small">
        No transactions yet.
      </p>

    `);

    return;
  }

  let html =
    "<h3>💳 Transactions</h3>";

  list.forEach(t => {

    html += `

      <div class="row">

        <span>
          ${t.type || "Transaction"}
          <br>

          <small>
            ${t.status || ""}
          </small>
        </span>

        <b>
          $${money(t.amount)}
        </b>

      </div>

    `;

  });

  showPanel(html);

}


/* =========================
   ADMIN
========================= */

async function adminPanel(){

  const x =
    await api("/api/admin/overview");

  if(!x.ok){

    showPanel(
      '<p class="small">Admin only.</p>'
    );

    return;
  }

  const o =
    x.overview || {};

  showPanel(`

    <h3>🛠 Admin Panel</h3>

    <div class="row">
      <span>Users</span>
      <b>${o.users || 0}</b>
    </div>

    <div class="row">
      <span>Blocked</span>
      <b>${o.blocked || 0}</b>
    </div>

    <div class="row">
      <span>Total Balance</span>
      <b>$${money(o.balance_total)}</b>
    </div>

    <div class="row">
      <span>Completed Deposits</span>
      <b>${o.deposits || 0}</b>
    </div>

    <div class="row">
      <span>Pending Withdrawals</span>
      <b>${o.withdrawals_pending || 0}</b>
    </div>

    <hr>

    <h4>📢 Broadcast</h4>

    <textarea
      id="broadcastMessage"
      placeholder="Write broadcast message...">
    </textarea>

    <button
      class="btn primary"
      onclick="broadcast()">
      Send Broadcast
    </button>

    <div id="adminResult"></div>

  `);

}


async function broadcast(){

  const message =
    document.getElementById(
      "broadcastMessage"
    ).value.trim();

  const result =
    document.getElementById(
      "adminResult"
    );

  if(!message){

    result.innerHTML =
      '<p class="warn">Write a message first.</p>';

    return;
  }

  result.innerHTML =
    '<p class="small">Sending...</p>';

  const x =
    await api(
      "/api/admin/broadcast",
      {
        method:"POST",
        body:JSON.stringify({
          message:message
        })
      }
    );

  if(x.ok){

    result.innerHTML =
      '<p class="ok">' +
      'Sent: ' + (x.sent || 0) +
      ' • Failed: ' + (x.failed || 0) +
      '</p>';

  }else{

    result.innerHTML =
      '<p class="warn">' +
      (x.error || "Broadcast failed.") +
      '</p>';

  }

}


/* =========================
   START
========================= */

load();

</script>

</body>
  </html>
